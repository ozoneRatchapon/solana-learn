# ทะเบียน "พิจารณาแล้วไม่เอา"
#
# ทำไมต้องมีไฟล์นี้:
# ตอนเจอลิงก์แล้วตัดสินใจว่า "ไม่เก็บ" ความรู้นั้นเคยหายไปทันที — อีกสองเดือนเจอ
# ลิงก์เดิม `check.sh` ก็ตอบว่า [ใหม่] เหมือนไม่เคยดู แล้วต้องไล่ตรวจใหม่ตั้งแต่ต้น
# การตัดสินใจว่า "ไม่เอา" มีต้นทุนเท่ากับการตัดสินใจว่า "เอา" แต่เดิมเก็บไว้แค่ฝั่งเดียว
#
# schema ต่อ 1 entry:
#   url:            URL ที่พิจารณา (unique หลัง normalize — ห้ามซ้ำกับ resources.yml)
#   reason:         ทำไมถึงไม่เก็บ (required) — เขียนให้คนอ่านแล้วไม่ต้องไปตรวจซ้ำ
#                   "ไม่ดี" ไม่มีค่า เขียนว่าซ้ำกับอะไร/ล้าสมัยตรงไหน/ผิดยังไง
#   superseded_by:  ถ้าไม่เอาเพราะมีตัวที่ดีกว่า ใส่ URL ตัวนั้น (optional)
#   checked:        YYYY-MM-DD วันที่ตัดสินใจ
#
# ปฏิเสธแล้วเปลี่ยนใจได้ — ลบ entry ออกจากไฟล์นี้แล้ว add.sh ตามปกติ
# แต่ให้เขียน reason ใหม่ว่าทำไมถึงเปลี่ยนใจไว้ใน note ของ resources.yml
#
# เพิ่มด้วย: ./scripts/reject.sh -u <url> -r "<เหตุผล>" [-b <url ที่ดีกว่า>]

