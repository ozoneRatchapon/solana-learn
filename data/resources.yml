    note: 'หนังสือ **เสียเงิน $9** (EPUB+PDF ไม่มี DRM อัปเดตฟรีตลอด) เล่มแรกชื่อ Basics จาก 4 เล่มที่วางไว้ — ไม่ใช่ tutorial แต่คือการ **พาอ่าน `solana-foundation/program-examples` ทั้ง 52 ตัวแบบรีวิว PR** ว่าทำอะไร ทำไมทำแบบนั้น และเวลาเขียนเองต้องระวังอะไร; **เหตุผลที่เก็บทั้งที่เสียเงินและไม่เป็นทางการ** — ผมเช็ค `Cargo.toml` ของต้นทางแล้วได้ `anchor-lang = "1.0.2"` (repo ★1425 MIT push 7 ส.ค. 2026) **ซึ่งหมายความว่าเนื้อหาอิงของปัจจุบัน ไม่ใช่ Anchor 0.3x เหมือนคอร์สเกือบทั้งเน็ต** และเล่มนี้ยังพา Hello World เดียวกันผ่านทั้ง Anchor / native Rust / Pinocchio เพื่อให้เห็นว่าเฟรมเวิร์กเป็นตัวเลือกไม่ใช่ข้อบังคับ พร้อมใช้ LiteSVM เทส ตรงกับสแตกที่เราแนะนำอยู่แล้ว; **สิ่งที่ยังตรวจไม่ได้และต้องถามก่อนซื้อ** — หน้าเว็บบอกว่า pin ไว้ที่ commit เดียวแต่ **ไม่ระบุว่า commit ไหน** ถ้า pin ไว้นานแล้วก็เจอปัญหาเดียวกับที่หนังสือเล่มนี้ตั้งใจแก้; ผู้เขียน Jose Ferrer ทำในนาม Moviendome Limited (ฮ่องกง) **ประกาศเองว่าไม่ได้สังกัด Solana Foundation** ส่วนการยกโค้ดทำได้เพราะต้นทางเป็น MIT'
