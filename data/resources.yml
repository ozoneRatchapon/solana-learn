    note: 'คอร์สระดับบัณฑิตศึกษาของ MIT ที่เอาเทคโนโลยีฝั่งคอมพิวเตอร์ (คริปโต บล็อกเชน tokenization แพลตฟอร์ม อัลกอริทึม) มาชนกับเครื่องมือฝั่งเศรษฐศาสตร์ (contract theory, mechanism design, general equilibrium, monetary theory) เป้าคือเข้าใจว่าข้อสมมติคืออะไร จุดอ่อนอยู่ตรงไหน และจะกระทบอะไรจริง — เปิดฟรีบน OCW มีทั้ง syllabus, readings, lecture notes และวิดีโอ; **ไม่ใช่ของ Solana แต่เก็บด้วยเหตุผลเฉพาะที่หนักกว่าปกติ** — ผู้สอนคือ Prof. Robert M. Townsend เจ้าของ Townsend Thai Project ที่สำรวจครัวเรือนไทยต่อเนื่องตั้งแต่ปี 1997 ครอบ 2,880 ครัวเรือน 262 กลุ่มชุมชน และ 161 สถาบันการเงินระดับหมู่บ้าน คือคนที่เข้าใจระบบการเงินฐานรากของไทยลึกที่สุดคนหนึ่ง มาสอนเรื่องออกแบบระบบการเงินด้วยบล็อกเชน; ใช้ตอนต้องเถียงเรื่อง tokenomics หรือออกแบบกลไกให้มีน้ำหนักกว่าอ้างจากบล็อกโปรโตคอล เช่นเวลาคุยเรื่อง SGP-0003 ที่เปลี่ยนโครงสร้างค่าธรรมเนียม ซึ่งเป็นโจทย์ mechanism design ตรงๆ'
