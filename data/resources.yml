    note: 'ของที่ชุมชนไทยทำเองและรันอยู่จริง — แก้ปัญหาคนลงชื่อแล้วไม่มา (งานฟรีมีอัตราไม่มา 30-40%) ด้วยการวางมัดจำ USDC ได้คืนเมื่อมาจริง ริบเมื่อไม่มา พร้อมออก badge เป็น cNFT ที่ ~$0.001 ต่อใบ ถูกกว่า POAP ราว 50 เท่า ค่าธุรกรรม ~$0.00087 เช็คอินเสร็จใน <500ms เพราะเสิร์ฟที่ edge; เขียน Rust ล้วน โฮสต์บน Cloudflare Workers มีเทส 85 ตัว; **ยังอยู่บน devnet ไม่ใช่ mainnet** — ตรงกับสูตร ship-program-to-mainnet ในไฟล์สูตรพอดี คือผ่านของฝั่ง client แล้วแต่ยังขาด audit/multisig/verified build; เก็บไว้เพราะเป็นหลักฐานว่าชุมชนนี้สร้างของได้จริง ไม่ใช่แค่รวบรวมลิงก์'
    status: ok
    added: 2026-08-05

