    note: 'แก้ปัญหาที่ Solana ยังทำไม่ได้ดีคือ latency ระดับต่ำกว่า slot — ใช้ Ephemeral Rollup ดึง account ออกมารันในเครื่องเร็วชั่วคราวแล้วค่อย settle กลับ เคลม block time 1ms และ end-to-end ต่ำกว่า 50ms รวมกับ TEE บน Intel TDX สำหรับงานที่ต้องปิดข้อมูล; เป้าหมายคือเกมหลายผู้เล่น เทรดความถี่สูง และงาน real-time ที่เดิมทำบนเชนไม่ไหว; ของจริงเปิดโค้ดหมดที่ org magicblock-labs (82 repo) ตัวหลักคือ magicblock-validator, delegation-program (ประตูเข้า rollup), magicblock-engine-examples และ hydra (crank แบบ permissionless) ทุกตัวยัง active ส.ค. 2026; ระวัง หน้าเว็บไม่ระบุสถานะ mainnet ชัด ต้องเช็คก่อนแนะนำใครเอาไปใช้จริง'
