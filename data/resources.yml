  - url: https://github.com/solana-foundation/solana-private-channels
    name: 'Solana Private Channels (payment channel ระดับองค์กร)'
    category: payments
    source: foundation
    tags: [payment-channel, privacy, token-2022, zk, experimental, rust]
    note: 'payment channel ที่ต่อสภาพคล่องกับ mainnet โดยตรง ทำธุรกรรมนับพันรายการแบบทันทีพร้อมคุมสิทธิ์และความเป็นส่วนตัว — ประกอบด้วย core ที่ทำ 5 ขั้น (ตัดซ้ำ ตรวจลายเซ็น จัดลำดับ ประมวลผล settle), โปรแกรม escrow/withdraw, indexer และ gateway; ใช้ Token-2022 confidential transfer กับ ZK proof ตอนถอนได้ ซึ่งเชื่อมกับหมวด tokens-nft; **ระวัง repo ประกาศเองว่ายังไม่ผ่าน audit และยังพัฒนาอยู่ ห้ามใช้กับเงินจริง** เก็บไว้อ่านว่า Foundation ออกแบบชั้น privacy ฝั่งองค์กรยังไง ไม่ใช่เอาไปใช้'
    status: ok
    added: 2026-08-05

  - url: https://solana.com/news/announcing-real-time-emissions-measurement-on-the-solana-blockchain
    name: 'ประกาศวัดคาร์บอนแบบเรียลไทม์ (บทความต้นทาง)'
    category: green
    source: foundation
    tags: [carbon, emission, trycarbonara, announcement, methodology]
    note: 'บทความที่อธิบายว่าวัดคาร์บอนยังไง — ฝังซอฟต์แวร์ลงบนโหนดโดยตรงร่วมกับ Trycarbonara ไม่ใช่ประมาณจากข้อมูลบนเชนอย่างเดียว ครอบทั้งพลังงานที่ใช้ การปล่อยของโหนด RPC คาร์บอนของ validator รายตัว และ embodied emission จากการผลิตและขนส่งฮาร์ดแวร์ Solana เคลมว่าเป็นเชนสัญญาอัจฉริยะรายใหญ่รายแรกที่วัดแบบเรียลไทม์; **เก็บตัวบทความไม่ใช่หน้าแท็ก** เพราะหน้าแท็ก energy-use-reports ตอบ 200 แต่ไม่มีโพสต์เรื่องพลังงานเลย (บันทึกไว้ใน rejected.yml แล้ว) — ตัวนี้คือที่ที่วิธีวัดถูกอธิบายไว้จริงและใช้อ้างอิงได้'
    status: ok
    added: 2026-08-05

  - url: https://solana.com/agent-registry
    name: 'Solana Agent Registry (ตัวตนและชื่อเสียงของ agent บนเชน)'
    category: ai-agent
    source: foundation
    tags: [agent, identity, reputation, erc-8004, onchain, registry]
    note: 'โปรโตคอลบนเชนที่ให้ AI agent มีตัวตนที่ยืนยันได้ ชื่อเสียงที่พกติดตัวไปได้ และโครงสร้างความน่าเชื่อถือ — ทำงานบน Solana และคุยกับมาตรฐาน ERC-8004 ฝั่ง Ethereum ได้ ลงทะเบียนครั้งละราว 0.009 SOL (~$0.81); ต่อกับสิ่งที่เก็บมาทั้งวันโดยตรง — Superteam Earn ให้ agent ทำงานได้แต่ต้องมีมนุษย์เคลมเงิน pay.sh ให้ agent จ่ายเงินได้ **ตัวนี้คือชั้นที่ตอบว่าแล้วจะเชื่อ agent ตัวไหนได้** ซึ่งเป็นคำถามที่เกิดขึ้นทันทีเมื่อ agent เริ่มถือเงินและรับงาน; มีสเปคกับ quickstart บน GitHub'
    status: ok
    added: 2026-08-05

  - url: https://ccaf.io/cbnsi/ethereum
    name: 'Cambridge CBNSI — ดัชนีพลังงานเชน (มุมที่ขัดกับที่ Solana เล่า)'
    category: green
    source: community
    tags: [research, cambridge, comparison, methodology, counter-evidence]
    note: 'ดัชนีของ Cambridge Centre for Alternative Finance (Judge Business School) วัดพลังงานเชนด้วยวิธีเดียวกันทุกเชน — วัดกำลังไฟที่ปลั๊กจริงของโหนด คูณจำนวนโหนดที่นับได้ แล้วเทียบข้ามเครือข่าย; **เก็บเพราะมันขัดกับเรื่องเล่าที่ฝั่ง Solana ใช้ ไม่ใช่ทั้งที่ขัด** — ตัวเลขที่มักถูกอ้างคือ Solana ใช้ 0.1 Wh ต่อธุรกรรม เทียบ Ethereum 35 Wh ซึ่งดูดีมาก แต่ Cambridge วัดต่อมูลค่าตลาดแล้วได้ว่า Solana ใช้ไฟรวมสูงสุด ~13.48 GWh/ปี และเข้มข้น ~283 kWh ต่อมูลค่าล้านดอลลาร์ ขณะที่ Ethereum ~7.87 GWh/ปี และ ~33 kWh **คือ Solana เข้มข้นกว่าราว 8.5 เท่า**; ทั้งสองตัวเลขถูกในวิธีวัดของตัวเอง — ต่อธุรกรรมกับต่อมูลค่าตอบคนละคำถาม **ถ้าจะพูดเรื่องพลังงานในที่สาธารณะต้องรู้ทั้งสองด้าน** ไม่งั้นโดนยกอันนี้มาค้านแล้วตอบไม่ได้'
    status: ok
    added: 2026-08-05
