    note: 'จุดที่ใช้จริงไม่ใช่หน้าเว็บ แต่คือ **https://solanapulse.kyzzen.io/rss/ ซึ่งให้เนื้อฉบับเต็มฟรี ไม่ต้องกรอกอีเมล** — ตรวจแล้วใน content:encoded มีข้อความเต็ม 3,887 ตัวอักษร ไม่มีร่องรอย members-only จึงให้สคริปต์หรือ agent ดึงเองได้; ทุกฉบับมีหัวข้อ **Opportunities** ที่ระบุ **วันปิดชัดเจน** เช่นฉบับ 4 ส.ค. 2026 — Jupiter Gacha $100K (ปิด 9 ส.ค.), PhoenixTrade USDC 420K (ปิด 23 ส.ค.), Solana Foundation $25K equity perps (ปิด 30 ส.ค.), Seeker Summer (ปิด 30 ส.ค.), Kamino USDG $300K (ปิด 13 ต.ค.) พ่วง Bounties Ending Soon กับ New Job Listings; **ระวังสองอย่าง** — (1) หน้า About เขียนว่า delivered daily แต่ฟีดจริงมี 15 ฉบับใน 42 วัน (24 มิ.ย.–4 ส.ค.) ราว 2–3 ครั้ง/สัปดาห์ เจ้าตัวยอมรับเองว่าข้ามไปหลายฉบับตอนไปงาน Malaysia Blockchain Week **อย่าใช้แทนการเช็คต้นทาง** (2) แคมเปญส่วนใหญ่เป็น incentive ฝั่งเทรด/ฟาร์มยิลด์ที่ต้องใส่เงินและขาดทุนได้ **ไม่ใช่โอกาสสาย builder แบบ grant/hackathon** ห้ามยกเข้าเรดาร์รวมกันโดยไม่แยก; ผู้ทำคือ Kyzzen ซึ่งเป็นแพลตฟอร์ม analytics บน Solana เอง จึงไม่ใช่กองบรรณาธิการเป็นกลาง; ใช้คู่กับ Colosseum Codex ไม่ใช่แทนกัน — Codex เกาะฝั่ง builder/โปรโตคอล/governance ส่วนตัวนี้เกาะฝั่งตลาด ยิลด์ และแคมเปญที่มีเดดไลน์'
