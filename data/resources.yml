  - url: https://blog.triton.one/self-hosting-superbank/
    name: 'Superbank — รัน indexer ประวัติ Solana เองทั้งเชน'
    category: infra-rpc
    source: vendor
    tags: [indexer, clickhouse, self-host, json-rpc, data-residency, rust]
    note: 'คู่มือรัน Superbank เอง — indexer ที่ดูดทั้ง ledger ลง ClickHouse แล้วเปิดเป็น JSON-RPC ที่เข้ากันได้กับ Solana แปลว่าเปลี่ยน endpoint แล้วโค้ดเดิมใช้ได้เลย ไม่มี rate limit; ประกอบ 3 ส่วน (ClickHouse / ingestor / superbank-rpc) คุยกันผ่าน HTTP แยกเครื่องได้ ต้องมี ClickHouse 26.x, Rust 1.80+, ป้อนข้อมูลจาก Dragon Mouth gRPC หรือ Fumarole แล้ว backfill ย้อนหลังจาก public RPC; ข้อควรรู้ก่อนตื่นเต้น — ขอ RAM อย่างน้อย 32 GB และแนะนำ 64 GB+ สำหรับ production ไม่ใช่ของที่รันบนโน้ตบุ๊กในเวิร์กช็อปได้; เหตุผลที่ควรรันเองคือคุมได้ว่าจะ index อะไร มีข้อกำหนดเรื่องที่เก็บข้อมูลในประเทศ หรือ query เยอะจนคิดเป็นรายครั้งแล้วไม่คุ้ม — ประเด็น data residency สำคัญกับงานที่ต้องคุยกับหน่วยงานกำกับไทย'
    status: ok
    added: 2026-08-04

