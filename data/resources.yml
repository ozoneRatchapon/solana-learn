# Solana Learn — Resource Catalog (SOURCE OF TRUTH)
#
# ทุกอย่างใน CATALOG.md generate มาจากไฟล์นี้ อย่าแก้ CATALOG.md ตรงๆ
#
# schema ต่อ 1 entry:
#   url:      canonical URL (required, unique หลัง normalize)
#   name:     ชื่อที่มนุษย์อ่านรู้เรื่อง (required)
#   category: ต้องตรงกับ key ใน categories ด้านล่าง (required)
#   source:   foundation | anza | community | vendor | thailand
#   tags:     [list] สำหรับ filter
#   note:     ทำไมถึงอยู่ในลิสต์ / ใช้ตอนไหน
#   status:   ok | blocked | dead | unverified   (scripts/linkcheck.sh อัปเดตให้ — เครื่องเป็นเจ้าของ)
#   deprecated:    '<เหตุผล>'  ยังเปิดได้แต่ไม่ควรใช้แล้ว (optional, คนเป็นเจ้าของ)
#   superseded_by: <url>      ใช้อะไรแทน (optional, คู่กับ deprecated)
#   added:    YYYY-MM-DD
#
# ทำไม deprecated ถึงเป็นฟิลด์แยก ไม่ใช่ค่าหนึ่งใน status:
#   status ตอบว่า "ลิงก์ยังเปิดได้ไหม" — linkcheck ยิง HTTP แล้วเขียนกลับเอง
#   deprecated ตอบว่า "ยังควรใช้ไหม" — คนตัดสิน เครื่องตัดสินแทนไม่ได้
#   tutorial Anchor 0.29 คือ status: ok (ลิงก์เปิดได้) และ deprecated พร้อมกัน
#   ถ้ายัดรวมเป็น status: deprecated แล้ว linkcheck --fix รอบหน้าจะเขียนทับเป็น ok
#   เพราะมันได้ HTTP 200 — คำตัดสินของคนหายไปเงียบๆ สองเรื่องนี้ตั้งฉากกัน ต้องแยกฟิลด์

