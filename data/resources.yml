  - url: https://docs.elfa.ai/agent-quickstart/
    name: 'Elfa Agent Quickstart — x402 บน Solana ที่ยิงได้จริงวันนี้'
    category: ai-agent
    source: vendor
    tags: [x402, agent, mcp, skill, llms-txt, content-negotiation]
    note: 'ต่างจากสามรายการ x402 ที่มีอยู่แล้วตรงที่**ตัวนี้เป็นของจริงที่ยิงได้เดี๋ยวนี้ ไม่ใช่เดโมหรือคู่มือ** — ผมยิงเองแล้ว `curl -i https://api.elfa.ai/x402/v2/aggregations/trending-tokens` คืน **HTTP 402** จริง; **กับดักที่ต้องรู้ก่อน — body เป็น `{}` เปล่าๆ เงื่อนไขการจ่ายทั้งหมดอยู่ใน header `payment-required` เป็น base64** ถ้าอ่านแต่ body จะนึกว่า API พัง; ถอดออกมาได้ x402Version 2 · 5 เชน · ขา Solana คือ network `solana:5eykt4UsFv8P8NJdTREpY1vzqKqZKvdp` asset `EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v` (USDC) amount `9000` = 0.009 USDC ตรงกับที่เอกสารเขียนเป๊ะ timeout 300 วินาที; **จุดที่ Solana ต่างจากอีก 4 เชนในลิสต์เดียวกัน — มี `extra.feePayer` มาให้ แปลว่าเซิร์ฟเวอร์ออกค่าแก๊สเอง agent ถือแค่ USDC ก็จ่ายได้ ไม่ต้องมี SOL สักหน่วย** นี่คือสิ่งที่ entry x402+Kora สาธิตไว้ แต่ตัวนี้คือของที่รันอยู่จริง; ราคา 0.009 USDC/call มาตรฐาน, 0.045 สำหรับ event-summary กับ trending-narratives, ส่วน `/chat` เลือกได้ระหว่าง `exact` (คงที่ $1 fast / $2 expert) กับ `upto` (อนุมัติ $2/$6 แต่หักตามที่ใช้จริง) — **โมเดล `upto` น่าศึกษาเพราะแก้ปัญหาที่ราคาต่อคำตอบ LLM เดาไม่ได้ล่วงหน้า**; ดูรายการที่จ่ายได้ทั้งหมดที่ `https://api.elfa.ai/.well-known/x402` (12 รายการ); อีกเรื่องที่ควรลอกวิธี — **docs ตัวนี้ตอบคนละอย่างตาม Accept header** `*/*` ได้ดัชนี text/plain 4,913 byte ส่วน `text/html` ได้หน้าเว็บ 8,428 byte และทุกหน้ามี `.md` ต่อท้ายได้ **ตรงข้ามกับกับดัก SPA ที่เราชนมาตลอด**; skill อยู่ที่ elfa-ai/skills (★5 push 6 ส.ค. 2026 สดมาก **แต่ไม่มี license** เอาไปใช้ในงานองค์กรต้องถามก่อน) และมี MCP server 12 tool สำหรับ client ที่รันคำสั่งไม่ได้'
    status: ok
    added: 2026-08-07

  - url: https://t.me/STEarnBot
    name: 'Superteam Earn Telegram Bot — แจ้งเตือน bounty ใหม่'
    category: funding
    source: community
    tags: [telegram, bot, alerts, bounty, push-notification]
    note: '**ยืนยันว่าเป็นของทางการจากซอร์สโค้ด ไม่ใช่จากคำโฆษณาของบอทเอง** — hardcode อยู่ใน `src/constants/Telegram.ts` ของ repo SuperteamDAO/earn (★253 push 7 ส.ค. 2026) เป็นค่า production ส่วน staging คือ @EarnNotificationsStagingBot; **เรื่องนี้ต้องเช็คทุกครั้งกับบอท Telegram สายคริปโต** เพราะบอทปลอมที่ก็อปชื่อกับรูปมาแล้วหลอกให้ต่อกระเป๋าเป็นรูปแบบหลอกลวงที่พบบ่อยที่สุด **ห้ามส่งต่อบอทให้ชุมชนโดยไม่ตามไปดูซอร์ส**; ประโยชน์กับเราคือ **เปลี่ยนจากไปเปิดเว็บดูเอง เป็นให้มันเด้งมาหา** — คู่กับ superteam.fun/earn/agents ที่เก็บไว้แล้วซึ่งเป็นฝั่ง API สำหรับ agent ตัวนี้คือฝั่งคน เอาเข้ากลุ่มชุมชนไทยได้เลยไม่ต้องมีใครคอยไล่เช็ค; **กับดักความเป็นส่วนตัวที่เจอตอนอ่านโค้ด** — ลิงก์เชื่อมบัญชีคือ `?start=<base64 ของอีเมลคุณ>` ซึ่ง **base64 ไม่ใช่การเข้ารหัส ใครเห็นลิงก์ก็ถอดอ่านอีเมลได้ทันที** อย่าแคปหน้าจอหรือส่งต่อลิงก์นั้นในกลุ่ม; **สิ่งที่ยังไม่ได้ตรวจ** — ไม่ได้ลองใช้บอทจริงเพราะต้องมีบัญชี Telegram พฤติกรรมจริง (ถี่แค่ไหน กรองตามภูมิภาค/สกิลได้ไหม) จึงยังตอบไม่ได้ ที่เขียนมาทั้งหมดมาจาก metadata กับซอร์สโค้ดเท่านั้น'
