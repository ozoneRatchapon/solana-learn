  - id: alchemy-solana-fund
    name: Alchemy Solana Fund
    url: https://www.alchemy.com/solana-20m-fund
    kind: grant
    opens: rolling
    closes: rolling
    reward: "เครดิตค่าบริการ infra สูงสุด $25K ต่อทีม (กองรวม $20M) — ไม่ใช่เงินสด"
    fit: ทีมที่กำลังจ่ายค่า RPC อยู่แล้วหรือกำลังจะจ่าย — ไม่ช่วยทีมที่ยังไม่มีทุนทำงาน
    effort: ต่ำมาก — กรอกฟอร์มเดียว ตอบกลับใน 5 วันทำการ
    verdict: >-
      คุ้มถ้าเข้าเงื่อนไข เพราะแรงที่ใช้ต่ำมากและระบุว่าไม่มี lock-in ไม่มี proprietary API
      ทำร่วมกับ Superteam และ Solana Foundation ซึ่งเป็นสองชื่อที่อยู่ในแคตตาล็อกแล้ว
      **แต่ต้องไม่เรียกว่า "ทุน $20M" เวลาบอกต่อ** — เป็นเครดิตค่าบริการของ Alchemy
      สูงสุด $25K ต่อทีม คนละเรื่องกับ Superteam Microgrant $10k ที่เป็นเงินจริง
      ถ้าสื่อสารผิดแล้วมีคนสมัครเพราะคิดว่าได้เงิน ความน่าเชื่อถือของคนบอกเสียเปล่าๆ;
      ยังไม่รู้อัตราการอนุมัติและเกณฑ์จริง หน้าเว็บไม่เขียนไว้ ต้องมีคนลองก่อนถึงจะบอกได้
    status: ready
    checked: 2026-08-06

  - id: simd-0550-0553-signaling
    name: โหวตสนับสนุน SIMD-0550 + SIMD-0553 (ลดเงินเฟ้อ + เผาค่าธรรมเนียม)
    url: https://governance.solana.com/
    kind: deadline
    opens: rolling
    closes: 2026-08-18
    reward: "ไม่มีรางวัล — เป็นสิทธิ์ที่มีอยู่แล้วและกำลังจะหมดเวลาใช้"
    fit: ใครก็ตามที่ stake SOL อยู่ รวมถึงคนที่ delegate ให้ validator คนอื่น
    effort: ต่ำมาก — แต่ต้องรู้ว่าทำได้ ซึ่งคนส่วนใหญ่ไม่รู้
    verdict: >-
      **ยืนยันได้ว่าข้อเสนอมีจริง** — SIMD-0550 (double disinflation) และ SIMD-0553
      (resource fee burn) อยู่ในรีโป solana-improvement-documents ทั้งคู่
      ตรวจชื่อไฟล์แล้ว: 0550-double-disinflation.md และ 0553-resource-fee-burn.md;
      **แต่ตัวเลข "ต้องได้ 15% ของ active stake ภายใน 18 ส.ค. และตอนนี้ยังไม่ถึง 6%"
      มาจากจดหมายข่าวของ Colosseum ผมยังยืนยันเองไม่ได้** เพราะ governance.solana.com
      เป็น SPA ที่ curl ไม่ได้เนื้อ และ SGP repo ยังว่าง (มีแต่ .keep)
      ต้องเปิดเบราว์เซอร์ดูเปอร์เซ็นต์จริงก่อนเอาไปบอกต่อ;
      จุดที่คุ้มค่าที่สุดถ้าตัวเลขจริง — **คนที่ delegate stake ให้ validator สามารถ override
      เสียงของ validator ตัวเองได้ด้วย stake account proof** ซึ่งเขียนไว้ใน docs.governance.solana.com
      ที่เก็บในแคตตาล็อกแล้ว **คนส่วนใหญ่ไม่รู้ว่าทำได้** นี่คือข้อมูลที่มีค่าที่สุดที่ชุมชนไทยส่งต่อได้
      โดยไม่ต้องมีทุน ไม่ต้องเขียนโค้ด และตรงกับสิ่งที่ SGP-0003 ที่เก็บไว้แล้วพูดถึง
    status: unproven
    checked: 2026-08-07

