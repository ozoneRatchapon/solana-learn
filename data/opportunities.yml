    name: Solana Blitz V7 (MagicBlock) — ธีม Collaboration
    url: https://build.magicblock.app/builders
    kind: hackathon
    opens: 2026-08-03
    closes: 2026-08-09
    reward: "ไม่ระบุบนหน้า — ต้องเปิดดูในเบราว์เซอร์"
    fit: คนที่อยากลองงาน real-time บน Solana ผ่าน Ephemeral Rollup ของ MagicBlock ในกรอบเวลาสั้น
    effort: หนึ่งสัปดาห์ และเหลือแค่ 4 วันนับจากวันที่บันทึก
    verdict: >-
      **ยืนยันจากต้นทางแล้ว** — /api/events คืน id 10 stage blitz status active
      ช่วง 2026-08-03T14:00 ถึง 2026-08-09T15:00 ธีม Collaboration ตรงกับที่เจ้าของเห็นในเบราว์เซอร์
      เส้นทางกว่าจะได้ข้อมูลนี้เป็นบทเรียน: curl หน้าเว็บเห็นแต่โครง 3 ขั้น เลยเคยสรุปผิดว่าไม่มีอะไรเปิด
      แล้วปฏิเสธทิ้ง · เจ้าของทักว่าเห็นข้อมูล · ใช้ probe.sh จับได้ว่าอ่านได้แค่ 278 จาก 25,000 byte
      · ตาม chunk ไปเจอ /api/rfps และ /api/events ที่เปิดสาธารณะ
      **สรุปคือทั้งคำบอกของคนและผลของเครื่องต่างก็ไม่พอเดี่ยวๆ ต้องหาต้นทางให้เจอ**;
      ธีม Collaboration กรอบหนึ่งสัปดาห์ เหมาะกับทีมเล็กที่อยากลองของโดยไม่ต้องทุ่มแบบ Eternal
      เงินรางวัลหลักยังไม่ปรากฏใน API ต้องเปิดดูในเบราว์เซอร์;
      **มีของแถมที่ไม่อยู่บนหน้าเว็บ** — Elfa AI ประกาศบน X ว่าสปอนเซอร์เครดิตมูลค่า 4,500 USDC
      ให้ผู้เข้าแข่งที่สร้างบน Iris ซึ่งเป็น real-time intelligence stack ของเขา
      ระบุว่า "จำนวนจำกัด มาก่อนได้ก่อน" แปลว่ายิ่งช้ายิ่งเสียเปรียบ ไม่ใช่แค่เรื่องเดดไลน์
      ตรวจจาก og:description ของโพสต์เอง ไม่ได้อ่านจากข่าว — แต่ **ลิงก์รับเครดิตเป็น t.co
      ที่ตามต่อไม่ได้ด้วย curl ต้องเปิดในเบราว์เซอร์**
    status: ready
    checked: 2026-08-05

