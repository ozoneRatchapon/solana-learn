# Radar — โอกาสที่เปิดอยู่ และของที่มีเดดไลน์ (SOURCE OF TRUTH)
#
# RADAR.md generate จากไฟล์นี้ อย่าแก้ RADAR.md ตรงๆ
#
# ทำไมต้องแยกจาก resources.yml:
# แคตตาล็อกเน่าเมื่อ "ลิงก์" เปลี่ยน ไฟล์นี้เน่าเมื่อ "เวลา" ผ่านไป — คนละกลไกกันโดยสิ้นเชิง
# bounty ที่ปิดไปแล้วยังตอบ HTTP 200 อยู่ linkcheck จับไม่ได้ ต้องให้ radar-check.sh ดูวันที่แทน
#
# ─────────────────────────────────────────────────────────────────────────
# ช่อง verdict คือหัวใจของไฟล์นี้
# ─────────────────────────────────────────────────────────────────────────
# ลิสต์โอกาสมีเยอะแล้วในโลก สิ่งที่ไม่มีคือคำตอบว่า **เราทำได้จริงไหม และรู้ได้ยังไง**
# verdict ต้องเป็นคำตัดสินที่ตรวจสอบได้ ไม่ใช่กำลังใจ:
#
#   ✗ "น่าสนใจมาก ควรลอง"
#   ✓ "ทำได้ — ต้องมีคนอ่าน Rust ระดับ consensus ได้ 1 คน ยังไม่รู้ว่าในชุมชนมีใคร
#      ต้องถามใน Genesis ก่อน 8 ส.ค. ไม่งั้นเหลือเวลาอ่านโค้ดไม่พอ"
#
# ถ้าเขียน verdict ไม่ได้ แปลว่ายังไม่ได้คิดจริง ให้ใส่ status: unproven ไว้ก่อน
#
# schema:
#   id       kebab-case ไม่ซ้ำ (required)
#   name     ชื่อที่คนเรียก (required)
#   url      ต้องมีอยู่จริงใน resources.yml (required)
#   kind     bounty | grant | hackathon | job | program | deadline
#   opens    YYYY-MM-DD หรือ rolling
#   closes   YYYY-MM-DD หรือ rolling
#   reward   ได้อะไร — ระบุให้ตรงกับที่ต้นทางเขียน อย่าปัดขึ้น
#   fit      ใครในชุมชนที่เหมาะ / ต้องมีอะไรก่อนถึงจะยื่นได้
#   effort   ประเมินแรงแบบตรงไปตรงมา
#   verdict  ทำได้จริงไหม + หลักฐาน + สิ่งที่ต้องรู้เพิ่ม (required)
#   status   ready | unproven | watching
#   checked  YYYY-MM-DD ที่ยืนยันล่าสุด
# ─────────────────────────────────────────────────────────────────────────

kinds:
  bounty: "ล่าบั๊ก / งานย่อยมีรางวัล"
  grant: "ทุน"
  hackathon: "แข่งสร้างของ"
  job: "งานประจำ / เปิดรับสมัคร"
  program: "โปรแกรมระยะยาว / ไดเรกทอรี"
  deadline: "ไม่ใช่โอกาส แต่เป็นวันที่ต้องเตรียมตัว"

statuses:
  ready: "ประเมินแล้วว่าลงมือได้ รู้ว่าต้องทำอะไร"
  unproven: "ยังตอบไม่ได้ว่าทำได้ไหม — ระบุไว้ว่าต้องพิสูจน์อะไรก่อน"
  watching: "ยังไม่เปิด / รอจังหวะ"

opportunities:
  - id: alpenglow-bounty
    name: Alpenglow Bug Bounty
    url: https://github.com/anza-xyz/alpenglow
    kind: bounty
    opens: 2026-08-05
    closes: 2026-08-19
    reward: "เพดาน 50,000 SOL เฉพาะกรณี Loss of Funds — ชั้นอื่นต่ำกว่านั้น"
    fit: คนที่อ่าน Rust ระดับ consensus ได้ จุดตั้งต้น 4 crate ใน agave — votor, votor-messages, bls-sigverify, bls-cert-verify
    effort: สูงมาก ต้องมี PoC ทุกระดับ รันบน local fork เท่านั้น
    verdict: >-
      หน้าต่างสั้นเกินกว่าจะสร้างคนได้ทัน แต่คุ้มที่จะกระจายข่าวเพราะเดิม Alpenglow ถูกกันออกจาก
      bug bounty ของ agave เพิ่งเข้าเกณฑ์รอบนี้ แปลว่าโค้ดผ่านสายตาคนนอกน้อยกว่าส่วนอื่น
      สิ่งที่ต้องบอกให้ครบตอนกระจาย — ไม่ต้องลงทะเบียน, ส่งผ่าน GitHub Security Advisory เท่านั้น,
      และอะไรที่ public แล้วตกเกณฑ์ทันทีรวมถึงโพสต์ใน Discord ซึ่งคนไทยชอบแชร์ระหว่างทาง
    status: ready
    checked: 2026-08-05

  - id: agave-4-2-activation
    name: Agave 4.2 เริ่มเปิด feature บน mainnet
    url: https://solana.com/upgrades/agave-4-2-release-overview
    kind: deadline
    opens: 2026-08-17
    closes: 2026-08-17
    reward: "ไม่มีรางวัล — แต่เป็นวันที่ของเปลี่ยนจริง"
    fit: ใครที่รัน indexer หรือมีโค้ดที่ประกอบ transaction เอง
    effort: ต่ำถ้าเตรียมล่วงหน้า สูงถ้ารู้ทีหลัง
    verdict: >-
      ไม่ต้องทำอะไรถ้าเป็น dev ทั่วไป แต่ tx v1 ขยายเป็น 4,096 byte ต้อง opt-in เอง
      และ indexer ต้องรองรับ layout ใหม่ · rent ลด 90% เปลี่ยนสมมติฐานต้นทุนของ
      Tier 3 เรื่อง ZK compression ไปแล้ว ควรอัปเดตเนื้อหาสอนก่อนวันนี้ ไม่ใช่หลัง
    status: ready
    checked: 2026-08-05

  - id: colosseum-eternal
    name: Colosseum Eternal
    url: https://colosseum.com/eternal
    kind: hackathon
    opens: rolling
    closes: rolling
    reward: "$250,000 pre-seed + ที่นั่งใน accelerator 8 สัปดาห์"
    fit: ทีมที่มีของอยู่แล้วระดับหนึ่ง เพราะต้องส่งผลิตภัณฑ์ใน 4 สัปดาห์นับจากกดนาฬิกาเอง
    effort: 4 สัปดาห์เต็มเวลา + วิดีโออัปเดต 1 นาทีทุกสัปดาห์
    verdict: >-
      เป็นข้อที่เปลี่ยนจากสมมติฐานเป็นของจริงแล้ว เพราะไม่ต้องรอรอบแฮกกาธอนอีกต่อไป
      สมมติฐานที่เหลือข้อเดียวคือทีมพร้อมทุ่ม 4 สัปดาห์ไหม ซึ่งตอบเองได้ไม่ต้องหาข้อมูลเพิ่ม
      กรรมการเป็นผู้ก่อตั้ง Helius/Jito/Tensor/Squads/Kamino/Drift/Phantom — เกณฑ์คือ
      ความสามารถในการจัดลำดับและส่งของ ไม่ใช่ความใหม่ของไอเดีย
    status: ready
    checked: 2026-08-05

