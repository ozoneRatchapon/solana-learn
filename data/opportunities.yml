  - id: superteam-earn
    name: Superteam Earn (bounty)
    url: https://earn.superteam.fun/
    kind: bounty
    opens: rolling
    closes: rolling
    reward: "ต่างกันไปตาม bounty"
    fit: คนในชุมชนที่อยากได้งานชิ้นแรกโดยยังไม่ต้องสมัครงานประจำ
    effort: ต่ำถึงปานกลางต่อชิ้น
    verdict: >-
      ตรวจเพิ่มแล้ว 5 ส.ค. 2026 ได้ข้อเท็จจริงสามข้อที่เดิมไม่มี — (1) มี bounty เปิดอยู่จริง
      ยืนยันได้สองรายการพร้อมวันประกาศผล คือ Panta Market Content Bounty (24 ส.ค.)
      และ Build Solana-native plugins for Zeroclaw ของ Superteam Brasil (21 ส.ค.)
      (2) ค่าตอบแทนต่อชิ้นอยู่ราว 1,500 USDC (3) แท็กสกิลที่ใช้จริงมีทั้ง Growth, Content,
      Design ไม่ใช่แค่ Backend/Blockchain แปลว่า **มีทางเข้าสำหรับคนที่ไม่ได้เขียนโค้ด**
      ซึ่งสำคัญมากเพราะคนในชุมชนไม่ได้เป็น dev ทุกคน;
      **แก้ไขจากที่เขียนไว้ก่อนหน้าในวันเดียวกัน** — ตอนแรกสรุปว่า automate ไม่ได้เพราะไล่ chunk
      40 ไฟล์แล้วไม่เจอ endpoint ที่จริงคือขุดผิดที่ Earn มี API ทางการสำหรับ agent อยู่ที่
      superteam.fun/skill.md และ /api/agents/listings/live ซึ่งกรอง type กับ deadline ได้
      แต่ต้องลงทะเบียนก่อน (ยิงเปล่าๆ ได้ 401) จึงไม่โผล่ตอนไล่หา endpoint สาธารณะ;
      แปลว่านับได้จริงและอัตโนมัติได้ เหลือแค่ตัดสินใจว่าจะลงทะเบียน agent ในนามเราไหม
      ซึ่งเป็นการสร้างบัญชีบนแพลตฟอร์มคนอื่น ต้องให้เจ้าของตัดสิน ไม่ใช่ทำแทน
    status: unproven
    checked: 2026-08-05

